# Explicit write allowlist: saved evidence stays intact; no video jobs or uploads.
map "$request_method:$uri" $judge_allowed {
    default 0;
    ~^(GET|HEAD): 1;
    ~^POST:/api/context/(login|logout|search|fusion/ask|fusion/conversation/select|lesson-reports)$ 1;
    ~^POST:/api/context/analysis/jobs/[^/]+/report$ 1;
    ~^POST:/api/context/fusion/reports/[^/]+/refresh$ 1;
    ~^POST:/api/context/lesson-reports/[^/]+/revise$ 1;
    ~^PUT:/api/context/lesson-reports/[^/]+$ 1;
}
limit_req_zone $binary_remote_addr zone=judge_requests:1m rate=20r/s;
limit_req_zone $binary_remote_addr zone=judge_login:1m rate=6r/m;
server {
    listen 8080;
    server_name _;
    client_max_body_size 256k;
    access_log off;
    limit_req_status 429;
    if ($judge_allowed = 0) { return 403 '{"detail":"judge_saved_evidence_mode: uploads, analysis jobs and source edits are disabled"}'; }
    location = / { return 302 /judge-guide.html; }
    location = /judge-guide.html { root /usr/share/nginx/html; }
    location ~ ^/(tracking|identity|validation|gold|demo|context|analyze|review|event-attribution|person-review)(/|$) { return 404; }
    location = /api/context/login {
        limit_req zone=judge_login burst=3 nodelay;
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        limit_req zone=judge_requests burst=120 nodelay;
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
    location / {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
